[workspace]
resolver = "3"
members = ["Kernel", "os"]

# `panic = "abort"` is required for the bare-metal kernel target
# (`x86_64-unknown-none`). Profiles must be defined at the workspace root;
# profiles in a non-root package are silently ignored by Cargo.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"