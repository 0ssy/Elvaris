[package]
name = "elvaris-sdk"
version = "0.1.0"
edition = "2024"
description = "Elvaris SDK: build, package, sign, install, and run native applications"

[dependencies]
packages = { path = "../packages" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"

[[bin]]
name = "elvaris-sdk"
path = "src/main.rs"