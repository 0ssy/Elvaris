[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
description = "Elvaris bare-metal kernel (x86-64, no_std)"

[features]
default = []
bare = []
alloc = []
# Optional subsystems, disabled by default for the resource-constrained
# embedded (headless service / minimal) profile. Enable individually for
# desktop/development builds.
graphics = []
audio = []
usb = []
desktop = []
shell = []
packages = []
debug = []
[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15"
spin = "0.9"
uart_16550 = "0.3"
linked_list_allocator = "0.10"

# The kernel binary is `#![no_main]` and links only for `x86_64-unknown-none`.
# It cannot be linked for the host target, so it's gated behind the `bare`
# feature and excluded from `cargo test` by default.
[[bin]]
name = "kernel"
path = "src/main.rs"
required-features = ["bare"]
test = false

# The integration test boots the kernel in QEMU, so it runs on the host
# target and links against the standard library.
[[test]]
name = "boot"
path = "tests/boot.rs"

[[test]]
name = "heap"
path = "tests/heap.rs"

[[test]]
name = "user"
path = "tests/user.rs"

# `panic = "abort"` is defined at the workspace root (see ../Cargo.toml).
# Profiles in non-root packages are silently ignored by Cargo, so we keep
# them out of this file to avoid confusion.