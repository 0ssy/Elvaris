[package]
name = "packages"
version = "0.1.0"
edition = "2024"
description = "Elvaris package format: manifest, archive, signing, and verification"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
thiserror = "1"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"